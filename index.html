<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><title>Phạm Phượng • Quản lý thuê đồ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#171717;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}header{background:#111;color:#fff;padding:16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}header strong{font-size:20px}header small{display:block;opacity:.7}.wrap{max-width:950px;margin:auto;padding:14px 14px 90px}button{border:0;border-radius:10px;padding:10px 13px;background:#111;color:white;font:inherit;cursor:pointer}button.light{background:#eee;color:#111}button.red{background:#a22}input,select,textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:9px;margin-top:5px;font:inherit}label{display:block;font-size:13px;color:#666;margin-top:10px}.card,.item{background:white;border-radius:14px;padding:14px;box-shadow:0 2px 10px #0000000a}.auth{max-width:440px;margin:35px auto}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric span,.muted{font-size:13px;color:#777}.metric b{display:block;font-size:22px;margin-top:5px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.title{font-weight:750;font-size:17px;margin:16px 0 8px}.list{display:grid;gap:9px;margin-top:10px}.tag{font-size:11px;padding:4px 8px;border-radius:30px;background:#eee}.ok{background:#e3f6e8}.warn{background:#fff0c8}.bad{background:#fde7e7}.tabs{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(5,1fr)}.tabs button{border-radius:0;background:white;color:#444;font-size:11px;padding:10px 2px}.tabs button.active{background:#eee;color:#000;font-weight:bold}.hidden{display:none!important}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:5;overflow:auto}.modal.open{display:block}.sheet{background:white;max-width:620px;min-height:100%;padding:18px;margin:auto}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.notice{padding:10px;border-radius:9px;background:#fff1cc;margin:10px 0;font-size:13px}.error{background:#fde7e7;color:#8b1111}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body><header><div><strong>PHẠM PHƯỢNG</strong><small>Quản lý tiệm cho thuê đồ</small></div><button id="logout" class="light hidden">Đăng xuất</button></header><main id="app" class="wrap"></main>
<nav id="tabs" class="tabs hidden"><button data-p="home">🏠<br>Trang chủ</button><button data-p="orders">🧾<br>Đơn thuê</button><button data-p="items">👗<br>Kho đồ</button><button data-p="customers">👩<br>Khách</button><button data-p="finance">💰<br>Thu chi</button></nav>
<div id="modal" class="modal"><div id="sheet" class="sheet"></div></div>
<script type="module">
import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const SUPABASE_URL="https://fglzzvxhhvoigkyivvxv.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_oVulHSP30h0L7EsTXmOGnw_cnKOpKF-";
const sb=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const app=document.querySelector('#app'),tabs=document.querySelector('#tabs'),logout=document.querySelector('#logout'),modal=document.querySelector('#modal'),sheet=document.querySelector('#sheet');
let page='home',db={customers:[],items:[],orders:[],finance:[]};
const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const money=n=>new Intl.NumberFormat('vi-VN').format(Number(n)||0)+' đ';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const cust=id=>db.customers.find(x=>x.id===id),thing=id=>db.items.find(x=>x.id===id);
function open(s){sheet.innerHTML=s;modal.classList.add('open')}function close(){modal.classList.remove('open')}modal.onclick=e=>{if(e.target===modal)close()};
function auth(mode='login',note=''){tabs.classList.add('hidden');logout.classList.add('hidden');app.innerHTML=`<section class="card auth"><h2>${mode==='login'?'Đăng nhập':'Đăng ký tài khoản'}</h2><p class="muted">Phạm Phượng • Quản lý thuê đồ</p>${note?`<div class="notice">${esc(note)}</div>`:''}<form id="af"><label>Email<input id="email" type="email" required autocomplete="email"></label><label>Mật khẩu<input id="pass" type="password" required minlength="6" autocomplete="${mode==='login'?'current-password':'new-password'}"></label><div class="actions"><button>${mode==='login'?'Đăng nhập':'Tạo tài khoản'}</button><button type="button" id="switch" class="light">${mode==='login'?'Đăng ký lần đầu':'Quay lại đăng nhập'}</button></div></form><div id="msg" class="muted"></div></section>`;document.querySelector('#switch').onclick=()=>auth(mode==='login'?'signup':'login');document.querySelector('#af').onsubmit=async e=>{e.preventDefault();let email=document.querySelector('#email').value.trim(),password=document.querySelector('#pass').value;document.querySelector('#msg').textContent='Đang xử lý…';let r=mode==='login'?await sb.auth.signInWithPassword({email,password}):await sb.auth.signUp({email,password});if(r.error){document.querySelector('#msg').textContent=r.error.message;return}if(mode==='signup'&&!r.data.session){auth('login','Đã tạo tài khoản. Hãy xác minh email nếu Supabase yêu cầu, rồi đăng nhập.');return}await start()}}
async function load(){let [c,i,o,f]=await Promise.all([sb.from('customers').select('*').order('created_at',{ascending:false}),sb.from('items').select('*').order('created_at',{ascending:false}),sb.from('orders').select('*').order('created_at',{ascending:false}),sb.from('finance').select('*').order('created_at',{ascending:false})]);let er=[c,i,o,f].find(x=>x.error);if(er)throw er.error;db={customers:c.data||[],items:i.data||[],orders:o.data||[],finance:f.data||[]};render()}
async function start(){tabs.classList.remove('hidden');logout.classList.remove('hidden');try{await load()}catch(e){app.innerHTML=`<section class="card"><h2>Chưa đọc được dữ liệu</h2><p>${esc(e.message)}</p><p>Kiểm tra file database.sql đã chạy trong Supabase chưa.</p><button onclick="location.reload()">Thử lại</button></section>`}}
logout.onclick=async()=>{await sb.auth.signOut();auth()};document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{page=b.dataset.p;render()});
function render(){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.p===page));({home,orders,items,customers,finance}[page])(app)}
function orderCard(o){let c=cust(o.customer_id),late=o.status!=='Đã trả'&&o.return_date<today();return `<div class="item"><div class="row"><b>${esc(c?.name||'Khách')}</b><span class="tag ${late?'bad':o.status==='Đã trả'?'ok':'warn'}">${late?'QUÁ HẠN':esc(o.status)}</span></div><div class="muted">${esc(c?.phone||'')} • Nhận ${esc(o.pickup_date)} • Trả ${esc(o.return_date)}</div><p>${(o.item_ids||[]).map(x=>esc(thing(x)?.name||'')).join(', ')}</p><div class="row"><b>${money(o.total)}</b><button class="light" onclick="viewOrder('${o.id}')">Chi tiết</button></div></div>`}
function home(el){let inc=db.finance.filter(x=>x.type==='Thu').reduce((s,x)=>s+Number(x.amount),0);el.innerHTML=`<div class="grid"><div class="card metric"><span>Đơn đang thuê</span><b>${db.orders.filter(x=>x.status==='Đang thuê').length}</b></div><div class="card metric"><span>Đơn cần trả</span><b>${db.orders.filter(x=>x.status!=='Đã trả'&&x.return_date<=today()).length}</b></div><div class="card metric"><span>Khách hàng</span><b>${db.customers.length}</b></div><div class="card metric"><span>Tổng thu</span><b>${money(inc)}</b></div></div><div class="row"><div class="title">Đơn gần đây</div><button onclick="newOrder()">+ Tạo đơn</button></div><div class="list">${db.orders.slice(0,8).map(orderCard).join('')||'<div class="card muted">Chưa có đơn thuê.</div>'}</div>`}
function orders(el){el.innerHTML=`<div class="row"><div class="title">Đơn thuê</div><button onclick="newOrder()">+ Tạo đơn</button></div><input placeholder="Tìm khách / SĐT..." oninput="filterOrders(this.value)"><div id="ol" class="list">${db.orders.map(orderCard).join('')}</div>`}
window.filterOrders=q=>{q=q.toLowerCase();document.querySelector('#ol').innerHTML=db.orders.filter(o=>((cust(o.customer_id)?.name||'')+' '+(cust(o.customer_id)?.phone||'')).toLowerCase().includes(q)).map(orderCard).join('')};
function itemCard(x){let busy=db.orders.some(o=>o.status!=='Đã trả'&&(o.item_ids||[]).includes(x.id));return `<div class="item"><div class="row"><b>${esc(x.name)}</b><span class="tag ${busy?'warn':'ok'}">${busy?'Đang giữ':'Đang rảnh'}</span></div><div class="muted">Mã ${esc(x.code||'-')} • Size ${esc(x.size||'-')} • ${esc(x.type||'Khác')}</div><p><b>${money(x.price)}</b>/lần thuê</p><div class="actions"><button class="light" onclick="editItem('${x.id}')">Sửa</button><button class="red" onclick="deleteItem('${x.id}')">Xóa</button></div></div>`}
function items(el){el.innerHTML=`<div class="row"><div class="title">Kho đồ (${db.items.length})</div><button onclick="newItem()">+ Thêm đồ</button></div><input placeholder="Tìm tên / mã / size..." oninput="filterItems(this.value)"><div id="il" class="list">${db.items.map(itemCard).join('')}</div>`}
window.filterItems=q=>{q=q.toLowerCase();document.querySelector('#il').innerHTML=db.items.filter(x=>(x.name+' '+(x.code||'')+' '+(x.size||'')).toLowerCase().includes(q)).map(itemCard).join('')};
function customerCard(c){return `<div class="item"><div class="row"><b>${esc(c.name)}</b><span>${esc(c.phone||'')}</span></div><div class="muted">${esc(c.address||'')}</div><div class="muted">Số đơn: ${db.orders.filter(o=>o.customer_id===c.id).length}</div></div>`}
function customers(el){el.innerHTML=`<div class="row"><div class="title">Khách hàng (${db.customers.length})</div><button onclick="newCustomer()">+ Thêm khách</button></div><input placeholder="Tìm tên / SĐT..." oninput="filterCustomers(this.value)"><div id="cl" class="list">${db.customers.map(customerCard).join('')}</div>`}
window.filterCustomers=q=>{q=q.toLowerCase();document.querySelector('#cl').innerHTML=db.customers.filter(c=>(c.name+' '+(c.phone||'')).toLowerCase().includes(q)).map(customerCard).join('')};
function finance(el){let a=db.finance.filter(x=>x.type==='Thu').reduce((s,x)=>s+Number(x.amount),0),b=db.finance.filter(x=>x.type==='Chi').reduce((s,x)=>s+Number(x.amount),0);el.innerHTML=`<div class="grid"><div class="card metric"><span>Tổng thu</span><b>${money(a)}</b></div><div class="card metric"><span>Tổng chi</span><b>${money(b)}</b></div><div class="card metric"><span>Lãi tạm tính</span><b>${money(a-b)}</b></div></div><div class="row"><div class="title">Thu chi</div><button onclick="newFinance()">+ Ghi sổ</button></div><div class="list">${db.finance.map(x=>`<div class="item"><div class="row"><b>${esc(x.note||'Không ghi chú')}</b><b>${x.type==='Thu'?'+':'-'} ${money(x.amount)}</b></div><div class="muted">${esc(x.date)} • ${esc(x.type)}</div></div>`).join('')||'<div class="card muted">Chưa có giao dịch.</div>'}</div>`}
window.newCustomer=()=>open(`<h2>Thêm khách hàng</h2><form id="cf"><label>Họ tên<input id="cn" required></label><label>SĐT<input id="cp"></label><label>Địa chỉ<input id="ca"></label><label>Ghi chú<textarea id="cg"></textarea></label><div class="actions"><button>Lưu khách</button><button type="button" class="light" onclick="close()">Hủy</button></div></form>`);
window.newItem=(x=null)=>{sheet.dataset.edit=x?.id||'';open(`<h2>${x?'Sửa đồ':'Thêm đồ'}</h2><form id="if"><label>Tên đồ<input id="nm" required value="${esc(x?.name||'')}"></label><label>Mã đồ<input id="code" value="${esc(x?.code||'')}"></label><label>Loại<input id="type" value="${esc(x?.type||'')}"></label><label>Size<input id="size" value="${esc(x?.size||'')}"></label><label>Giá thuê<input id="price" type="number" min="0" value="${x?.price||0}"></label><label>Tiền cọc<input id="dep" type="number" min="0" value="${x?.deposit||0}"></label><div class="actions"><button>Lưu</button><button type="button" class="light" onclick="close()">Hủy</button></div></form>`)};window.editItem=i=>newItem(thing(i));window.deleteItem=async i=>{if(confirm('Xóa món đồ này?')){let r=await sb.from('items').delete().eq('id',i);if(r.error)alert(r.error.message);await load()}};
window.newOrder=()=>{if(!db.customers.length||!db.items.length)return alert('Hãy thêm ít nhất một khách hàng và một món đồ trước.');open(`<h2>Tạo đơn thuê</h2><form id="of"><label>Khách hàng<select id="oc">${db.customers.map(c=>`<option value="${c.id}">${esc(c.name)} — ${esc(c.phone||'')}</option>`).join('')}</select></label><label>Chọn đồ (nhiều món)<select id="oi" multiple size="6">${db.items.map(x=>`<option value="${x.id}">${esc(x.code||'')} • ${esc(x.name)} • ${money(x.price)}</option>`).join('')}</select></label><label>Ngày nhận<input id="pickup" type="date" value="${today()}" required></label><label>Ngày trả<input id="ret" type="date" value="${today()}" required></label><label>Tiền cọc<input id="deposit" type="number" min="0" value="0"></label><label>Đã thanh toán<input id="paid" type="number" min="0" value="0"></label><label>Ghi chú<textarea id="note"></textarea></label><div class="actions"><button>Tạo đơn</button><button type="button" class="light" onclick="close()">Hủy</button></div></form>`)};
window.viewOrder=i=>{let o=db.orders.find(x=>x.id===i),c=cust(o.customer_id);open(`<h2>Chi tiết đơn</h2><div class="card"><b>${esc(c?.name||'Khách')}</b><p class="muted">${esc(c?.phone||'')}</p><p>Nhận: ${esc(o.pickup_date)}<br>Trả: ${esc(o.return_date)}</p><p>${(o.item_ids||[]).map(x=>'👗 '+esc(thing(x)?.name||'')).join('<br>')}</p><p>Tiền thuê: <b>${money(o.total)}</b><br>Đã thanh toán: <b>${money(o.paid)}</b><br>Tiền cọc: <b>${money(o.deposit)}</b><br>Còn phải thu: <b>${money(Math.max(0,o.total-o.paid))}</b></p></div><div class="actions"><button onclick="returnOrder('${i}')">Xác nhận đã trả đồ</button><button class="light" onclick="printOrder('${i}')">In phiếu</button><button class="light" onclick="close()">Đóng</button></div>`)};
window.returnOrder=async i=>{let r=await sb.from('orders').update({status:'Đã trả'}).eq('id',i);if(r.error)return alert(r.error.message);close();await load()};
window.printOrder=i=>{let o=db.orders.find(x=>x.id===i),c=cust(o.customer_id),w=window.open('','_blank');if(!w)return alert('Cho phép cửa sổ bật lên để in phiếu.');w.document.write(`<html><meta charset="utf-8"><title>Phiếu thuê đồ</title><body style="font-family:Arial;padding:24px;max-width:650px;margin:auto"><h2 style="text-align:center">PHIẾU THUÊ ĐỒ – PHẠM PHƯỢNG</h2><p>Khách: <b>${esc(c?.name)}</b><br>SĐT: ${esc(c?.phone||'')}<br>Nhận: ${esc(o.pickup_date)}<br>Trả: ${esc(o.return_date)}</p><table border="1" cellpadding="8" cellspacing="0" width="100%"><tr><th>STT</th><th>Tên đồ</th><th>Giá thuê</th></tr>${(o.item_ids||[]).map((x,j)=>`<tr><td>${j+1}</td><td>${esc(thing(x)?.name||'')}</td><td>${money(thing(x)?.price)}</td></tr>`).join('')}</table><p>Tiền thuê: ${money(o.total)}<br>Cọc: ${money(o.deposit)}<br>Đã thanh toán: ${money(o.paid)}<br>Còn phải thu: ${money(Math.max(0,o.total-o.paid))}</p><p>Địa chỉ: Ngã 3 An Nghiệp, gần Cầu Neo Cũ, Thanh Miện</p><p style="margin-top:50px">Khách ký ____________________ Tiệm ký ____________________</p><script>window.print()<\/script></body></html>`);w.document.close()};
window.newFinance=()=>open(`<h2>Ghi thu chi</h2><form id="ff"><label>Loại<select id="ft"><option>Thu</option><option>Chi</option></select></label><label>Số tiền<input id="amount" type="number" min="0" required></label><label>Nội dung<input id="desc" required></label><div class="actions"><button>Lưu</button><button type="button" class="light" onclick="close()">Hủy</button></div></form>`);
document.addEventListener('submit',async e=>{e.preventDefault();let r;if(e.target.id==='cf'){r=await sb.from('customers').insert({name:cn.value.trim(),phone:cp.value.trim(),address:ca.value.trim(),note:cg.value.trim()})}else if(e.target.id==='if'){let o={name:nm.value.trim(),code:code.value.trim(),type:type.value.trim(),size:size.value.trim(),price:Number(price.value)||0,deposit:Number(dep.value)||0};r=sheet.dataset.edit?await sb.from('items').update(o).eq('id',sheet.dataset.edit):await sb.from('items').insert(o);sheet.dataset.edit=''}else if(e.target.id==='of'){let ids=[...oi.selectedOptions].map(x=>x.value);if(!ids.length)return alert('Chọn ít nhất một món đồ.');if(ret.value<pickup.value)return alert('Ngày trả không được trước ngày nhận.');let conflict=db.orders.some(o=>o.status!=='Đã trả'&&(o.item_ids||[]).some(x=>ids.includes(x))&&!(ret.value<o.pickup_date||pickup.value>o.return_date));if(conflict)return alert('Có món đồ bị trùng lịch thuê.');let total=ids.reduce((s,x)=>s+Number(thing(x)?.price||0),0),paid=Number(document.querySelector('#paid').value)||0;r=await sb.from('orders').insert({customer_id:oc.value,item_ids:ids,pickup_date:pickup.value,return_date:ret.value,deposit:Number(deposit.value)||0,paid,total,status:'Đang thuê',note:note.value});if(!r.error&&paid){let fr=await sb.from('finance').insert({date:today(),type:'Thu',amount:paid,note:'Thanh toán đơn thuê'});if(fr.error)alert('Đơn đã tạo nhưng ghi thu lỗi: '+fr.error.message)}}else if(e.target.id==='ff'){r=await sb.from('finance').insert({date:today(),type:ft.value,amount:Number(amount.value)||0,note:desc.value.trim()})}else return;if(r?.error)return alert(r.error.message);close();await load()});
const {data:{session}}=await sb.auth.getSession();if(SUPABASE_PUBLISHABLE_KEY==='DAN_PUBLISHABLE_KEY_CUA_ANH')auth('login','Trước khi dùng, hãy thay Publishable key trong index.html bằng khóa của dự án Supabase.');else if(session)await start();else auth();
sb.auth.onAuthStateChange((_event,session)=>{if(!session)auth()});
</script></body></html>
